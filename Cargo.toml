[workspace]
members = [
 "co-circom/circom-mpc-compiler",
 "co-circom/circom-mpc-vm",
 "co-circom/co-circom-types",
 "co-circom/co-circom",
 "co-circom/co-groth16",
 "co-circom/co-plonk",
 "co-noir/co-acvm",
 "co-noir/co-brillig",
 "co-noir/co-builder",
 "co-noir/ultrahonk",
 "co-noir/co-ultrahonk",
 "co-noir/co-noir",
 "co-noir/co-noir-types",
 "co-noir/noir-types",
 "co-noir/co-noir-common",
 "mpc-core",
 "mpc-net",
 "tests",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.90"
authors = ["TACEO GmbH <hello@taceo.io>"]
homepage = "https://www.taceo.io"
repository = "https://github.com/TaceoLabs/co-snarks"
license = "MIT OR Apache-2.0"
publish = false
readme = "./README.md"

[workspace.dependencies]
acir = { version = "1.0.0-beta.26", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.26", package = "acir" }
acvm = { version = "1.0.0-beta.26", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.26", package = "acvm" }
brillig = { version = "1.0.0-beta.26", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.26", package = "brillig" }
noirc-abi = { version = "1.0.0-beta.26", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.26", package = "noirc_abi" }
noirc-artifacts = { version = "1.0.0-beta.26", git = "https://github.com/noir-lang/noir/", tag = "v1.0.0-beta.26", package = "noirc_artifacts" }

ark-bls12-377 = "0.6"
ark-bls12-381 = "0.6"
ark-bn254 = "0.6"
ark-ec = { version = "0.6", default-features = false }
ark-groth16 = { version = "0.6" }
ark-ff = { version = "0.6", features = ["asm"] }
ark-grumpkin = "0.6"
ark-poly = "0.6"
ark-relations = "0.6"
ark-serialize = { version = "0.6", features = ["derive", "std"] }
ark-std = { version = "0.6", features = ["std"] }
bincode = "1.3"
blake2 = "0.10"
blake3 = "1.6"
bytemuck = { version = "1.25", features = ["derive"] }
byteorder = "1.5"
bytes = "1.11"
circom-types = { package = "taceo-circom-types", version = "0.3.1" }
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
criterion = { version = "0.5", features = ["async_tokio"] }
eyre = "0.6"
figment = { version = "0.10", features = ["toml", "env"] }
hex-literal = "0.4"
intmap = "3.1"
itertools = "0.15"
num-bigint = { version = "0.4" }
num-traits = { version = "0.2", default-features = false }
paste = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.8"
rcgen = "0.13"
rustls = "0.23"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9"
libaes = "0.7"
sha2 = { version = "0.10", features = ["compress"] }
sha3 = "0.10"
nom = "7"
ruint = "1.20"
subtle = "2.6"
taceo-ark-algebra = "0.1.0"
thiserror = "2"
toml = "1.1"
tracing = { version = "0.1" }
tracing-subscriber = "0.3"

# This profile can be used for CI in pull requests.
[profile.ci-dev]
opt-level = 1
inherits = "dev"
incremental = false
debug = true
overflow-checks = false
# [profile.ci-dev.build-override]
# opt-level = 3
